name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --all
      - name: Modulo checksums are up to date
        run: |
          for m in modulos/*/; do
            expected=$(grep -o '"checksum": "[^"]*"' "$m/modulo.json" | cut -d'"' -f4)
            actual=$(./target/release/prox --modulos checksum "$m")
            if [ "$expected" != "$actual" ]; then
              echo "::error::stale checksum in $m (run: prox --modulos checksum $m --write)"; exit 1
            fi
          done
